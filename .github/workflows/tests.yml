name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  swift-test:
    name: Swift Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build package
        run: swift build

      - name: Build with complete strict concurrency checking
        run: swift build -Xswiftc -strict-concurrency=complete

      - name: Run tests
        run: swift test --parallel

  documentation:
    name: DocC Build Check
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Build documentation
        run: |
          DOCS_DIR="$(mktemp -d)"
          swift package --allow-writing-to-directory "$DOCS_DIR" \
            generate-documentation --target SwiftUIPresentation \
            --output-path "$DOCS_DIR" \
            --transform-for-static-hosting \
            --hosting-base-path SwiftUIPresentation

  apple-platforms:
    name: Apple Platform Compile Checks
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -scheme SwiftUIPresentation \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/SwiftUIPresentation-iOS" \
            build

      - name: Build for macOS
        run: |
          xcodebuild \
            -scheme SwiftUIPresentation \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/SwiftUIPresentation-macOS" \
            build
