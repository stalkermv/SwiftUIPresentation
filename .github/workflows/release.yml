name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    name: Create Source Release
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build with complete strict concurrency checking
        run: swift build -Xswiftc -strict-concurrency=complete

      - name: Run tests
        run: swift test --parallel

      - name: Build package
        run: swift build

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -scheme SwiftUIPresentation \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/SwiftUIPresentation-iOS" \
            build

      - name: Build for macOS
        run: |
          xcodebuild \
            -scheme SwiftUIPresentation \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/SwiftUIPresentation-macOS" \
            build

      - name: Build for tvOS
        run: |
          xcodebuild \
            -scheme SwiftUIPresentation \
            -destination "generic/platform=tvOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/SwiftUIPresentation-tvOS" \
            build

      - name: Build for watchOS
        run: |
          xcodebuild \
            -scheme SwiftUIPresentation \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/SwiftUIPresentation-watchOS" \
            build

      - name: Build documentation
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target SwiftUIPresentation \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path SwiftUIPresentation

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            # SwiftUIPresentation ${{ github.ref_name }}

            Unified SwiftUI navigation for iOS and macOS with stack and modal flows backed by a single testable path.

            ## Installation

            ```swift
            dependencies: [
                .package(url: "https://github.com/stalkermv/SwiftUIPresentation.git", from: "${{ github.ref_name }}")
            ]
            ```

            ## Documentation

            - DocC: https://stalkermv.github.io/SwiftUIPresentation/
            - Changelog: https://github.com/stalkermv/SwiftUIPresentation/blob/main/CHANGELOG.md

            ## Highlights

            - Source-first MIT-licensed Swift Package
            - One destination registration reused for push and modal presentation
            - Destination-level modal host selection while keeping `PresentationLink(value:)` stable
